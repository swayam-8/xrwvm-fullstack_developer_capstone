services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  dealers:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on:
      mongo:
        condition: service_healthy
  sentiment:
    build: ./server/djangoapp/microservices
  web:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a stable random DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      backend_url: http://dealers:3030
      sentiment_analyzer_url: http://sentiment:5050
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - web-data:/data
    depends_on:
      - dealers
      - sentiment
volumes:
  mongo-data:
  web-data:
