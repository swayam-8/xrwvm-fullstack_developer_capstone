name: Workflow evidence
on:
  workflow_run:
    workflows: [Capstone checks]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Display completed workflow and successful steps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: gh run view "$RUN_ID" --repo "$REPOSITORY" --verbose
